<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard IoT Paneles Solares</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #07111f;
    --panel: #0f172a;
    --panel2: #111c31;
    --border: #1e3a5f;
    --text: #e5f3ff;
    --muted: #8fb3d9;
    --blue: #38bdf8;
    --orange: #fb923c;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #facc15;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #10233f, #07111f 55%);
    color: var(--text);
    min-height: 100vh;
}

header {
    padding: 24px 30px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.5px;
}

header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
}

.container {
    padding: 24px;
    max-width: 1600px;
    margin: 0 auto;
}

.info {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 14px;
}

.sources {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 24px;
}

.source-card {
    background: linear-gradient(180deg, #111c31, #0b1424);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.2s;
}

.source-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.source-card id {
    margin: 0;
    font-size: 22px;
}

.badge {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.online {
    background: rgba(34,197,94,.15);
    color: var(--green);
    border: 1px solid rgba(34,197,94,.4);
    box-shadow: 0 0 10px rgba(34,197,94,.1);
}

.offline {
    background: rgba(239,68,68,.15);
    color: var(--red);
    border: 1px solid rgba(239,68,68,.4);
}

.metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.metric {
    background: rgba(7,17,31,.85);
    border: 1px solid rgba(56,189,248,.15);
    border-radius: 14px;
    padding: 16px;
}

.metric span {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.metric strong {
    display: block;
    font-size: 24px;
    margin-top: 8px;
    font-weight: 600;
}

.bar {
    height: 6px;
    background: #0b1220;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 12px;
}

.fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--blue);
    transition: width 1s ease-in-out;
}

.fill.orange { background: var(--orange); }
.fill.green { background: var(--green); }
.fill.yellow { background: var(--yellow); }

.power-box {
    margin-top: 14px;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(90deg, rgba(56,189,248,.08), rgba(56,189,248,.02));
    border: 1px solid rgba(56,189,248,.25);
}

.power-box span {
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.power-box strong {
    display: block;
    font-size: 28px;
    margin-top: 5px;
    color: var(--text);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.chart-box {
    background: linear-gradient(180deg, #111c31, #0b1424);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    height: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

@media(max-width: 1200px) {
    .sources, .grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <h1>☀️ Dashboard IoT Comparativo - Paneles Solares</h1>
    <p>Panel José (Lab) · Panel Mauricio (Edificio) · Monitoreo y Comparativa en Tiempo Real</p>
</header>

<div class="container">
    <div class="info" id="info">Sincronizando con Firebase y RedMeteo...</div>

    <div class="sources">
        <div class="source-card" id="cardJose"></div>
        <div class="source-card" id="cardMauricio"></div>
        <div class="source-card" id="cardRedmeteo"></div>
    </div>

    <div class="grid">
        <div class="chart-box"><canvas id="tempChart"></canvas></div>
        <div class="chart-box"><canvas id="voltChart"></canvas></div>
        <div class="chart-box"><canvas id="currChart"></canvas></div>
        <div class="chart-box"><canvas id="irrChart"></canvas></div>
    </div>
</div>

<script>
const maxPuntos = 20;

function formato(valor, unidad, dec = 1) {
    if (valor === null || valor === undefined || isNaN(valor)) return "-";
    return Number(valor).toFixed(dec) + " " + unidad;
}

function porcentaje(valor, max) {
    if (valor === null || valor === undefined || isNaN(valor)) return 0;
    return Math.min(100, Math.max(0, (Number(valor) / max) * 100));
}

function textoIrradiacion(valor) {
    if (valor === null || valor === undefined || isNaN(valor)) return "-";
    return Number(valor).toFixed(1) + " W/m²";
}

function claseEstado(estado) {
    if (estado === "Offline" || estado === "Sin datos") return "badge offline";
    return "badge online";
}

function crearMetric(nombre, valor, unidad, max, color = "", dec = 1) {
    const ancho = porcentaje(valor, max);
    return `
        <div class="metric">
            <span>${nombre}</span>
            <strong>${formato(valor, unidad, dec)}</strong>
            <div class="bar">
                <div class="fill ${color}" style="width:${ancho}%"></div>
            </div>
        </div>
    `;
}

function crearCard(data) {
    if (!data) {
        return `
            <div class="source-top">
                <h2>Sin conexión</h2>
                <span class="badge offline">Offline</span>
            </div>
        `;
    }

    const clase = claseEstado(data.estado);
    const esRed = data.fuente === "RedMeteo";

    if (esRed) {
        return `
            <div class="source-top">
                <h2>静态 ${data.fuente}</h2>
                <span class="${clase}">${data.estado}</span>
            </div>
            <div class="metrics">
                ${crearMetric("Temperatura", data.temperatura, "°C", 45, "", 1)}
                ${crearMetric("Humedad", data.humedad, "%", 100, "green", 1)}
                ${crearMetric("Presión", data.presion, "hPa", 1100, "orange", 1)}
                <div class="metric">
                    <span>Irradiación</span>
                    <strong>${textoIrradiacion(data.irradiacion)}</strong>
                    <div class="bar">
                        <div class="fill yellow" style="width:${porcentaje(data.irradiacion, 1000)}%"></div>
                    </div>
                </div>
            </div>
        `;
    }

    const voltaje = Number(data.voltaje || 0);
    const corriente = Number(data.corriente || 0);
    const potencia = voltaje * corriente;

    return `
        <div class="source-top">
            <h2>🔋 ${data.fuente}</h2>
            <span class="${clase}">${data.estado}</span>
        </div>
        <div class="metrics">
            ${crearMetric("Temperatura", data.temperatura, "°C", 45, "", 1)}
            ${crearMetric("Voltaje", data.voltaje, "V", 24, "green", 2)}
            ${crearMetric("Corriente", data.corriente, "A", 3, "orange", 2)}
            <div class="metric">
                <span>Irradiación</span>
                <strong>${textoIrradiacion(data.irradiacion)}</strong>
                <div class="bar">
                    <div class="fill yellow" style="width:${porcentaje(data.irradiacion, 1000)}%"></div>
                </div>
            </div>
        </div>
        <div class="power-box">
            <span>Potencia Generada</span>
            <strong>${potencia.toFixed(2)} W</strong>
        </div>
    `;
}

function crearGrafico(id, titulo, unidad, etiquetas_fuentes, colores_fuentes) {
    return new Chart(document.getElementById(id), {
        type: "line",
        data: {
            labels: [],
            datasets: etiquetas_fuentes.map((f, i) => ({
                label: f,
                data: [],
                borderColor: colores_fuentes[i],
                backgroundColor: colores_fuentes[i] + '33',
                tension: 0.4,
                pointRadius: 3,
                pointHoverRadius: 6,
                borderWidth: 2,
                fill: true
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { color: "#e5f3ff", usePointStyle: true, padding: 20 } },
                title: { display: true, text: titulo, color: "#e5f3ff", font: { size: 16, weight: '600' }, padding: { bottom: 15 } }
            },
            scales: {
                x: { ticks: { color: "#8fb3d9" }, grid: { color: "rgba(143,179,217,.08)" } },
                y: { ticks: { color: "#8fb3d9", callback: value => value + " " + unidad }, grid: { color: "rgba(143,179,217,.08)" } }
            }
        }
    });
}

// DEFINICIÓN DE LOS 4 GRÁFICOS SOLICITADOS
const tempChart = crearGrafico("tempChart", "Temperatura Comparativa", "°C", 
    ["Panel José", "Panel Mauricio", "RedMeteo"], 
    ["#38bdf8", "#fb923c", "#22c55e"]);

const voltChart = crearGrafico("voltChart", "Voltaje Generado (Comparativa)", "V", 
    ["Panel José", "Panel Mauricio"], 
    ["#38bdf8", "#fb923c"]);

const currChart = crearGrafico("currChart", "Corriente Eléctrica (Comparativa)", "A", 
    ["Panel José", "Panel Mauricio"], 
    ["#38bdf8", "#fb923c"]);

const irrChart = crearGrafico("irrChart", "Irradiación Solar Captada", "W/m²", 
    ["Panel José", "Panel Mauricio", "RedMeteo"], 
    ["#38bdf8", "#fb923c", "#22c55e"]);

function agregarPuntos(chart, hora, valores) {
    chart.data.labels.push(hora);
    valores.forEach((valor, i) => {
        chart.data.datasets[i].data.push(
            valor === null || valor === undefined || isNaN(valor) ? null : Number(valor)
        );
    });
    if (chart.data.labels.length > maxPuntos) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
    }
    chart.update();
}

async function cargarDatos() {
    try {
        const res = await fetch("/api/dashboard");
        const json = await res.json();

        if (!json.ok) {
            document.getElementById("info").textContent = "Error de servidor: " + json.error;
            return;
        }

        const datos = json.data;
        const jose = datos.find(d => d.fuente === "Panel José");
        const mauricio = datos.find(d => d.fuente === "Panel Mauricio");
        const redmeteo = datos.find(d => d.fuente === "RedMeteo");

        document.getElementById("cardJose").innerHTML = crearCard(jose);
        document.getElementById("cardMauricio").innerHTML = crearCard(mauricio);
        document.getElementById("cardRedmeteo").innerHTML = crearCard(redmeteo);

        document.getElementById("info").innerHTML =
            `<strong>Estación Base:</strong> ${redmeteo?.estacion || "-"} &nbsp;|&nbsp; 
             <strong>Ref. Ambiental:</strong> ${json.redmeteo_fecha || "-"} &nbsp;|&nbsp; 
             <strong>Última sincronización IoT:</strong> <span style="color:var(--green)">${json.timestamp}</span>`;

        // ENVÍO DE DATOS EN ORDEN A LOS NUEVOS GRÁFICOS
        agregarPuntos(tempChart, json.timestamp, [jose?.temperatura, mauricio?.temperatura, redmeteo?.temperatura]);
        agregarPuntos(voltChart, json.timestamp, [jose?.voltaje, mauricio?.voltaje]);
        agregarPuntos(currChart, json.timestamp, [jose?.corriente, mauricio?.corriente]);
        agregarPuntos(irrChart, json.timestamp, [jose?.irradiacion, mauricio?.irradiacion, redmeteo?.irradiacion]);

    } catch (error) {
        document.getElementById("info").textContent = "Error de conexión: " + error.message;
    }
}

cargarDatos();
setInterval(cargarDatos, 60000); 
</script>

</body>
</html>
