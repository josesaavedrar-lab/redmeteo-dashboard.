¿<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard IoT Paneles Solares</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #07111f;
    --panel: #0f172a;
    --panel2: #111c31;
    --border: #1e3a5f;
    --text: #e5f3ff;
    --muted: #8fb3d9;
    --blue: #38bdf8;
    --orange: #fb923c;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #facc15;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #10233f, #07111f 55%);
    color: var(--text);
}

header {
    padding: 24px 30px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid var(--border);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    color: var(--muted);
}

.container {
    padding: 24px;
}

.info {
    color: var(--muted);
    margin-bottom: 20px;
}

.sources {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 24px;
}

.source-card {
    background: linear-gradient(180deg, #111c31, #0b1424);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.source-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.source-card h2 {
    margin: 0;
    font-size: 22px;
}

.badge {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
}

.online {
    background: rgba(34,197,94,.15);
    color: var(--green);
    border: 1px solid rgba(34,197,94,.4);
}

.sim {
    background: rgba(251,146,60,.15);
    color: var(--orange);
    border: 1px solid rgba(251,146,60,.4);
}

.offline {
    background: rgba(239,68,68,.15);
    color: var(--red);
    border: 1px solid rgba(239,68,68,.4);
}

.metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.metric {
    background: rgba(7,17,31,.85);
    border: 1px solid rgba(56,189,248,.18);
    border-radius: 16px;
    padding: 14px;
}

.metric span {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.metric strong {
    display: block;
    font-size: 25px;
    margin-top: 6px;
}

.bar {
    height: 8px;
    background: #0b1220;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
}

.fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--blue);
}

.fill.orange { background: var(--orange); }
.fill.green { background: var(--green); }
.fill.yellow { background: var(--yellow); }
.fill.red { background: var(--red); }

.power-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 16px;
    background: rgba(56,189,248,.08);
    border: 1px solid rgba(56,189,248,.25);
}

.power-box span {
    color: var(--muted);
    font-size: 12px;
}

.power-box strong {
    display: block;
    font-size: 26px;
    margin-top: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.chart-box {
    background: linear-gradient(180deg, #111c31, #0b1424);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px;
    height: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

@media(max-width: 1100px) {
    .sources, .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>☀️ Dashboard IoT Comparativo - Paneles Solares</h1>
    <p>Panel José · Panel Mauricio · RedMeteo Valparaíso · Monitoreo en tiempo real</p>
</header>

<div class="container">
    <div class="info" id="info">Cargando datos...</div>

    <div class="sources">
        <div class="source-card" id="cardJose"></div>
        <div class="source-card" id="cardMauricio"></div>
        <div class="source-card" id="cardRedmeteo"></div>
    </div>

    <div class="grid">
        <div class="chart-box"><canvas id="tempChart"></canvas></div>
        <div class="chart-box"><canvas id="humChart"></canvas></div>
        <div class="chart-box"><canvas id="presChart"></canvas></div>
        <div class="chart-box"><canvas id="irrChart"></canvas></div>
    </div>
</div>

<script>
const maxPuntos = 20;
const fuentes = ["Panel José", "Panel Mauricio", "RedMeteo"];
const colores = ["#38bdf8", "#fb923c", "#22c55e"];

function formato(valor, unidad, dec = 1) {
    if (valor === null || valor === undefined || isNaN(valor)) return "-";
    return Number(valor).toFixed(dec) + " " + unidad;
}

function porcentaje(valor, max) {
    if (valor === null || valor === undefined || isNaN(valor)) return 0;
    return Math.min(100, Math.max(0, (Number(valor) / max) * 100));
}

function textoIrradiacion(valor) {
    if (valor === null || valor === undefined || isNaN(valor)) return "-";
    if (Number(valor) === 0) return "0.0 W/m² · Sin radiación";
    return Number(valor).toFixed(1) + " W/m²";
}

function claseEstado(estado) {
    if (estado === "Simulado") return "badge sim";
    if (estado === "Offline" || estado === "Sin datos") return "badge offline";
    return "badge online";
}

function crearMetric(nombre, valor, unidad, max, color = "", dec = 1) {
    const ancho = porcentaje(valor, max);
    return `
        <div class="metric">
            <span>${nombre}</span>
            <strong>${formato(valor, unidad, dec)}</strong>
            <div class="bar">
                <div class="fill ${color}" style="width:${ancho}%"></div>
            </div>
        </div>
    `;
}

function crearCard(data) {
    if (!data) {
        return `
            <div class="source-top">
                <h2>Sin datos</h2>
                <span class="badge offline">Offline</span>
            </div>
        `;
    }

    const clase = claseEstado(data.estado);
    const esRed = data.fuente === "RedMeteo";

    if (esRed) {
        return `
            <div class="source-top">
                <h2>🌦️ ${data.fuente}</h2>
                <span class="${clase}">${data.estado}</span>
            </div>

            <div class="metrics">
                ${crearMetric("Temperatura", data.temperatura, "°C", 45, "", 1)}
                ${crearMetric("Humedad", data.humedad, "%", 100, "green", 1)}
                ${crearMetric("Presión", data.presion, "hPa", 1100, "orange", 1)}
                <div class="metric">
                    <span>Irradiación</span>
                    <strong>${textoIrradiacion(data.irradiacion)}</strong>
                    <div class="bar">
                        <div class="fill yellow" style="width:${porcentaje(data.irradiacion, 1000)}%"></div>
                    </div>
                </div>
            </div>
        `;
    }

    const voltaje = Number(data.voltaje || 0);
    const corriente = Number(data.corriente || 0);
    const potencia = voltaje * corriente;

    return `
        <div class="source-top">
            <h2>🔋 ${data.fuente}</h2>
            <span class="${clase}">${data.estado}</span>
        </div>

        <div class="metrics">
            ${crearMetric("Temperatura", data.temperatura, "°C", 45, "", 1)}
            ${crearMetric("Voltaje", data.voltaje, "V", 15, "green", 2)}
            ${crearMetric("Corriente", data.corriente, "A", 2, "orange", 2)}
            <div class="metric">
                <span>Irradiación</span>
                <strong>${textoIrradiacion(data.irradiacion)}</strong>
                <div class="bar">
                    <div class="fill yellow" style="width:${porcentaje(data.irradiacion, 1000)}%"></div>
                </div>
            </div>
        </div>

        <div class="power-box">
            <span>Potencia estimada</span>
            <strong>${potencia.toFixed(2)} W</strong>
        </div>
    `;
}

function crearGrafico(id, titulo, unidad) {
    return new Chart(document.getElementById(id), {
        type: "line",
        data: {
            labels: [],
            datasets: fuentes.map((f, i) => ({
                label: f,
                data: [],
                borderColor: colores[i],
                backgroundColor: colores[i],
                tension: 0.35,
                pointRadius: 4,
                borderWidth: 2
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: "#e5f3ff" } },
                title: {
                    display: true,
                    text: titulo,
                    color: "#e5f3ff",
                    font: { size: 16 }
                }
            },
            scales: {
                x: {
                    ticks: { color: "#8fb3d9" },
                    grid: { color: "rgba(143,179,217,.12)" }
                },
                y: {
                    ticks: {
                        color: "#8fb3d9",
                        callback: value => value + " " + unidad
                    },
                    grid: { color: "rgba(143,179,217,.12)" }
                }
            }
        }
    });
}

const tempChart = crearGrafico("tempChart", "Temperatura Comparativa", "°C");
const humChart = crearGrafico("humChart", "Humedad / Referencia", "%");
const presChart = crearGrafico("presChart", "Presión / Referencia", "hPa");
const irrChart = crearGrafico("irrChart", "Irradiación Comparativa", "W/m²");

function agregar(chart, hora, valores) {
    chart.data.labels.push(hora);

    valores.forEach((valor, i) => {
        chart.data.datasets[i].data.push(
            valor === null || valor === undefined || isNaN(valor) ? null : Number(valor)
        );
    });

    if (chart.data.labels.length > maxPuntos) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
    }

    chart.update();
}

async function cargarDatos() {
    try {
        const res = await fetch("/api/dashboard");
        const json = await res.json();

        if (!json.ok) {
            document.getElementById("info").textContent = "Error: " + json.error;
            return;
        }

        const datos = json.data;

        const jose = datos.find(d => d.fuente === "Panel José");
        const mauricio = datos.find(d => d.fuente === "Panel Mauricio");
        const redmeteo = datos.find(d => d.fuente === "RedMeteo");

        document.getElementById("cardJose").innerHTML = crearCard(jose);
        document.getElementById("cardMauricio").innerHTML = crearCard(mauricio);
        document.getElementById("cardRedmeteo").innerHTML = crearCard(redmeteo);

        document.getElementById("info").textContent =
            "Estación RedMeteo: " + (redmeteo?.estacion || "-") +
            " · Fecha RedMeteo: " + (json.redmeteo_fecha || "-") +
            " · Última actualización dashboard: " + json.timestamp;

        agregar(tempChart, json.timestamp, datos.map(d => d.temperatura));
        agregar(humChart, json.timestamp, datos.map(d => d.humedad ?? null));
        agregar(presChart, json.timestamp, datos.map(d => d.presion ?? null));
        agregar(irrChart, json.timestamp, datos.map(d => d.irradiacion));

    } catch (error) {
        document.getElementById("info").textContent = "Error cargando datos: " + error;
    }
}

cargarDatos();
setInterval(cargarDatos, 60000);
</script>

</body>
</html>
